name: mobile
description: "App do Mundial Tickets: mostra os ingressos do comprador e valida a entrada na portaria."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

# Cada pacote está justificado na seção 2 de docs/Passo_a_passo_Mobile_PIM_IV.md.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/img/logo.png
    - assets/flags/

  # A fonte vai dentro do app: nada é baixado em tempo de execução.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

# Gera o ícone do app a partir do logo: "dart run flutter_launcher_icons".
# Só precisa rodar de novo se o logo mudar. As imagens geradas ficam no Git.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icone/icone_app.png
  adaptive_icon_background: "#0d0d0d"
  adaptive_icon_foreground: assets/icone/icone_app_frente.png
  min_sdk_android: 24
